<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrinksCup | Catálogo de Licores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>🥃 DrinksCup</h1>
    <p>Tu catálogo de licores favorito</p>
  </header>

  <section class="controles">
    <input type="text" id="buscador" placeholder="Buscar licor...">
    <div class="filtros" id="filtros"></div>
  </section>

  <main>
    <div class="catalogo" id="catalogo"></div>
    <p class="vacio" id="vacio" hidden>No se encontraron tus licores 😕</p>
  </main>

  <footer class="footer">
    <p>© 2026 DrinksCup · Consume responsablemente. Prohibida la venta a menores de edad.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
